<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runner Calc">
<link rel="manifest" href="manifest.json">
<title>Runner Calc</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0}main{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:36px;margin:0;font-weight:800;letter-spacing:-1px}p.sub{margin:5px 0 18px;color:#6e6e73}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab,.quick button,.swap{min-height:44px;border:1px solid #d1d1d6;border-radius:12px;background:white;font-weight:650;color:#111}
.tab.active,.swap.primary{background:#111;color:white;border-color:#111}
.card{background:white;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px #0000000b}
h2{font-size:21px;margin:0 0 15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row.three{grid-template-columns:repeat(3,1fr)}
.field{margin-bottom:13px}.field label{display:block;text-align:center;font-size:12px;font-weight:800;color:#6e6e73;margin-bottom:5px;letter-spacing:.5px}
input{width:100%;height:54px;border:1px solid #d1d1d6;border-radius:13px;background:#f8f8fa;text-align:center;font-size:21px;font-weight:650;outline:none}
input:focus{border-color:#111;box-shadow:0 0 0 2px #1112}
.hint{text-align:center;color:#8e8e93;font-size:12px;margin-top:-6px;margin-bottom:12px}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin:3px 0 15px}.quick button{padding:0 12px}
.result{background:#f2f2f7;border-radius:16px;text-align:center;padding:16px}.value{font-size:40px;font-weight:800;letter-spacing:-1px}.unit{font-size:13px;color:#6e6e73;margin-top:2px}
.swap{padding:0 15px;margin-bottom:10px}.full{width:100%}
.footer{text-align:center;color:#8e8e93;font-size:12px;margin-top:16px}
@media(max-width:370px){h1{font-size:32px}.row.three{gap:6px}.card{padding:15px}}
</style>
</head>
<body>
<main>
<h1>Runner Calc</h1>
<p class="sub">Din enkla löparkalkylator</p>
<div class="tabs">
<button class="tab active" data-tab="time">Tid</button>
<button class="tab" data-tab="pace">Tempo</button>
<button class="tab" data-tab="convert">Konvertera</button>
</div>
<div id="app"></div>
<div class="footer">Fungerar utan internet efter installation.</div>
</main>
<script>
const app=document.getElementById('app');
const n=id=>Number(document.getElementById(id)?.value||0);
const pace=s=>{if(!(s>0))return '—';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const duration=s=>{if(!(s>0))return '—';s=Math.round(s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
let distMode=true,paceMode=true;

function render(type){
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===type));
if(type==='time') app.innerHTML=`
<section class="card"><h2>⏱ Tid från tempo</h2>
<div class="row"><div class="field"><label>MIN</label><input id="pm" type="number" inputmode="numeric" value="5" min="0"></div>
<div class="field"><label>SEK</label><input id="ps" type="number" inputmode="numeric" value="0" min="0" max="59"></div></div>
<div class="hint">Tempo per kilometer</div>
<div class="field"><label>STRÄCKA · KM</label><input id="d" type="number" inputmode="decimal" value="10" min="0.01" step="0.01"></div>
<div class="quick"><button data-d="5">5 km</button><button data-d="10">10 km</button><button data-d="21.0975">Halvmaraton</button><button data-d="42.195">Maraton</button></div>
<div class="result"><div class="value" id="out">50:00</div><div class="unit">total tid</div></div></section>`;
if(type==='pace') app.innerHTML=`
<section class="card"><h2>🏃 Tempo från tid</h2>
<div class="row three"><div class="field"><label>TIM</label><input id="h" type="number" inputmode="numeric" value="0" min="0"></div>
<div class="field"><label>MIN</label><input id="m" type="number" inputmode="numeric" value="50" min="0"></div>
<div class="field"><label>SEK</label><input id="s" type="number" inputmode="numeric" value="0" min="0" max="59"></div></div>
<div class="field"><label>STRÄCKA · KM</label><input id="d2" type="number" inputmode="decimal" value="10" min="0.01" step="0.01"></div>
<div class="result"><div class="value" id="out">5:00</div><div class="unit">min/km</div></div></section>`;
if(type==='convert') app.innerHTML=`
<section class="card"><h2>📏 Distans</h2>
<div class="field"><label id="dl">KM</label><input id="cd" type="number" inputmode="decimal" value="10" min="0" step="0.01"></div>
<button class="swap primary full" id="ds">${distMode?'KM → MILES':'MILES → KM'}</button>
<div class="result"><div class="value" id="dout">6.21</div><div class="unit" id="du">miles</div></div></section>
<section class="card"><h2>⚡ Tempo</h2>
<div class="row"><div class="field"><label>MIN</label><input id="cpm" type="number" inputmode="numeric" value="5" min="0"></div>
<div class="field"><label>SEK</label><input id="cps" type="number" inputmode="numeric" value="0" min="0" max="59"></div></div>
<button class="swap primary full" id="psw">${paceMode?'MIN/KM → MIN/MILE':'MIN/MILE → MIN/KM'}</button>
<div class="result"><div class="value" id="pout">8:03</div><div class="unit" id="pu">${paceMode?'min/mile':'min/km'}</div></div></section>`;

const update=()=>{
if(type==='time'){document.getElementById('out').textContent=duration((n('pm')*60+n('ps'))*n('d'))}
if(type==='pace'){let t=n('h')*3600+n('m')*60+n('s'),d=n('d2');document.getElementById('out').textContent=d>0?pace(t/d):'—'}
if(type==='convert'){
let d=n('cd');document.getElementById('dout').textContent=d>0?(distMode?d/1.609344:d*1.609344).toFixed(2):'—';
document.getElementById('dl').textContent=distMode?'KM':'MILES';document.getElementById('du').textContent=distMode?'miles':'km';
let p=n('cpm')*60+n('cps');document.getElementById('pout').textContent=pace(paceMode?p*1.609344:p/1.609344);document.getElementById('pu').textContent=paceMode?'min/mile':'min/km';
}}
app.querySelectorAll('input').forEach(x=>x.addEventListener('input',update));
if(type==='time')app.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>{document.getElementById('d').value=b.dataset.d;update()}));
if(type==='convert'){document.getElementById('ds').onclick=()=>{distMode=!distMode;render('convert')};document.getElementById('psw').onclick=()=>{paceMode=!paceMode;render('convert')}}
update();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));
render('time');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
